apiVersion: apps/v1
kind: Deployment
metadata:
  name: etl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: etl
  template:
    metadata:
      labels:
        app: etl
    spec:
      containers:
      - name: etl
        image: cryptopulse-etl:latest  # image Docker du job ETL
        imagePullPolicy: Never         # utilise l'image locale
        env:
        - name: DB_HOST
          value: "postgres-service"    # nom du Service PostgreSQL
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_PASSWORD
