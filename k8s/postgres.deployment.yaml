apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        envFrom:
        - configMapRef:
            name: postgres-config-map  
        - secretRef:
            name: crypto-secret        
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d  # PostgreSQL exécute ce SQL au démarrage
      volumes:
      - name: init-sql
        configMap:
          name: postgres-init           # contient init.sql