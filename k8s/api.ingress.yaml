apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
  name: api-ingress
  namespace: cryptopulse
  annotations:
    kubernetes.io/ingress.class: traefik # Dit explicitement à K8s que c'est Traefik qui gère ça
spec:
  rules:
  - host: api.cryptopulse.local  # Le nom de domaine virtuel de l' API
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-service
            port:
              number: 8000