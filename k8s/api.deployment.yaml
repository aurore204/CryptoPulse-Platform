apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cryptopulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: cryptopulse-api:latest
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: postgres-config-map  
        - secretRef:
            name: crypto-secret        
        ports:
        - containerPort: 8000