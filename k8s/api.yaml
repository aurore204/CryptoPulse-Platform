apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: cryptopulse-api:latest  # image Docker de l'API
        imagePullPolicy: Never         # utilise l'image locale
        env:
        - name: DB_HOST
          value: "postgres-service"    # nom du Service PostgreSQL
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: crypto-secret
              key: DB_PASSWORD
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service             # expose l'API vers l'extérieur du cluster
metadata:
  name: api-service
spec:
  selector:
    app: api
  type: NodePort          # rend l'API accessible depuis le navigateur
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30000       # port accessible depuis le navigateur