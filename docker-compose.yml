version: '3.8'

services:

  db:
    image: postgres:15-alpine        
    env_file:
      - .env                         
    environment:
      POSTGRES_DB: ${DB_NAME}        # crée automatiquement la base au démarrage
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data  # sauvegarde les données même si le conteneur redémarre
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"            
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s   
      retries: 5  
  # Conteneur 2 — API FastAPI
  api:
    build:
      context: .                     # racine du projet
      dockerfile: api/Dockerfile     
    env_file:
      - .env
    environment:
      DB_HOST: db  
    ports:                  
      - "8000:8000"
    depends_on:
      - db                           
  # Conteneur 3 — ETL
  etl:
    build:
      context: .
      dockerfile: etl/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db                    # même chose, pointe vers le conteneur db
    depends_on:
      db:
        condition: service_healthy 

volumes:
  postgres_data:                     # volume nommé — persist les données PostgreSQL